name: Release Plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install JPRM
        run: pip install jprm

      - name: Build Plugin
        # Create artifacts folder because jprm expects it, and run restore
        run: |
          mkdir -p artifacts
          dotnet restore Jellyfin.Plugin.Visualizer.sln
          jprm plugin build --dotnet-configuration Release .

      - name: Extract zip filename
        id: zip_name
        run: |
          ZIP_FILE=$(ls artifacts/*.zip | head -n 1)
          echo "filepath=$ZIP_FILE" >> $GITHUB_OUTPUT
          echo "filename=$(basename $ZIP_FILE)" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ steps.zip_name.outputs.filepath }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin
          git worktree add gh-pages
          cd gh-pages
          git checkout gh-pages || git checkout --orphan gh-pages
          git reset --hard || true
          git rm -rf . || true

      - name: Generate Repository Manifest
        run: |
          # Copy the zip to the gh-pages directory temporarily to calculate hashes
          cp ${{ steps.zip_name.outputs.filepath }} gh-pages/
          cd gh-pages
          
          # Initialize empty repo if needed
          jprm repo init .
          
          # We construct the URL to the GitHub Release asset
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ steps.zip_name.outputs.filename }}"
          
          # Add the plugin release to the manifest
          jprm repo add -U "$DOWNLOAD_URL" . ${{ steps.zip_name.outputs.filename }}
          
          # Remove the zip file from gh-pages, we only want the manifest.json
          rm ${{ steps.zip_name.outputs.filename }}

      - name: Publish manifest to gh-pages
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd gh-pages
          git add manifest.json
          git commit -m "Update repository manifest for release ${{ github.ref_name }}"
          git push origin gh-pages
